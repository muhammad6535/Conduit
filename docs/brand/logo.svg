<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" fill="none">
  <defs>
    <linearGradient id="g1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
    <linearGradient id="g2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#22d3ee"/>
    </linearGradient>
  </defs>
  <!-- Outer ring (gateway) -->
  <circle cx="200" cy="200" r="185" stroke="url(#g1)" stroke-width="8" fill="none" opacity="0.3"/>
  <!-- Inner ring -->
  <circle cx="200" cy="200" r="140" stroke="url(#g2)" stroke-width="4" fill="none" opacity="0.2"/>
  <!-- Central node (conduit hub) -->
  <circle cx="200" cy="200" r="40" fill="url(#g1)"/>
  <circle cx="200" cy="200" r="28" fill="white" opacity="0.15"/>
  <!-- Flow arrows (clockwise) connecting nodes -->
  <path d="M200 40 A 160 160 0 0 1 360 200" stroke="url(#g1)" stroke-width="3" fill="none" stroke-dasharray="8,8" opacity="0.6"/>
  <path d="M360 200 A 160 160 0 0 1 200 360" stroke="url(#g2)" stroke-width="3" fill="none" stroke-dasharray="8,8" opacity="0.6"/>
  <path d="M200 360 A 160 160 0 0 1 40 200" stroke="url(#g1)" stroke-width="3" fill="none" stroke-dasharray="8,8" opacity="0.6"/>
  <path d="M40 200 A 160 160 0 0 1 200 40" stroke="url(#g2)" stroke-width="3" fill="none" stroke-dasharray="8,8" opacity="0.6"/>
  <!-- Inward arrows (optimization flow) -->
  <path d="M200 160 L200 180" stroke="url(#g2)" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M160 200 L180 200" stroke="url(#g2)" stroke-width="3"/>
  <path d="M240 200 L220 200" stroke="url(#g2)" stroke-width="3"/>
  <path d="M200 240 L200 220" stroke="url(#g2)" stroke-width="3"/>
  <!-- Dollar sign in center -->
  <text x="200" y="212" font-family="Arial, sans-serif" font-size="40" font-weight="bold" fill="white" text-anchor="middle">$</text>
  <!-- Small node circles on the ring -->
  <circle cx="200" cy="40" r="10" fill="#6366f1"/>
  <circle cx="346" cy="120" r="10" fill="#6366f1" opacity="0.7"/>
  <circle cx="360" cy="200" r="10" fill="#06b6d4"/>
  <circle cx="346" cy="280" r="10" fill="#06b6d4" opacity="0.7"/>
  <circle cx="200" cy="360" r="10" fill="#6366f1"/>
  <circle cx="54" cy="280" r="10" fill="#6366f1" opacity="0.7"/>
  <circle cx="40" cy="200" r="10" fill="#06b6d4"/>
  <circle cx="54" cy="120" r="10" fill="#06b6d4" opacity="0.7"/>
</svg>
