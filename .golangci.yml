run:
  timeout: 5m
  tests: true
  modules-download-mode: readonly
  allow-parallel-runners: true

linters:
  enable:
    - errcheck
    - gofmt
    - goimports
    - gosimple
    - govet
    - ineffassign
    - misspell
    - revive
    - staticcheck
    - unconvert
    - unused
  disable:
    - deadcode
    - varcheck
    - structcheck

linters-settings:
  errcheck:
    exclude-functions:
      - (io.Closer).Close
  revive:
    rules:
      - name: exported
        severity: warning
  gofmt:
    simplify: true
  goimports:
    local-prefixes: github.com/conduit-ai/gateway
