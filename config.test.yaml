server:
  host: "127.0.0.1"
  port: 9090

providers:
  - name: "openai"
    type: "openai"
    api_key: "sk-test-fake-key"
    models:
      - "gpt-4o"
      - "gpt-4o-mini"

  - name: "anthropic"
    type: "anthropic"
    api_key: "sk-ant-test-fake-key"
    models:
      - "claude-sonnet-4"
      - "claude-haiku-3"

routing:
  default_provider: "openai"
  default_model: "gpt-4o-mini"
  rules:
    - pattern: "claude-.*"
      provider: "anthropic"
    - pattern: "gpt-.*"
      provider: "openai"

cost:
  max_budget_per_month: 1000.0
  alert_threshold: 80.0
