services:
  conduit:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    container_name: conduit-gateway
    ports:
      - "8080:8080"
    environment:
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
    volumes:
      - ./config.yaml:/etc/conduit/config.yaml
    restart: unless-stopped
