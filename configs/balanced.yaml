# Conduit Config: Balanced (Cost + Quality)
# Recommended for most organizations.
# Uses cheap models for simple tasks, best models for complex reasoning.

server:
  host: "0.0.0.0"
  port: 8080

providers:
  - name: "openai"
    type: "openai"
    api_key: "${OPENAI_API_KEY}"
    models:
      - "gpt-4o"
      - "gpt-4o-mini"

  - name: "anthropic"
    type: "anthropic"
    api_key: "${ANTHROPIC_API_KEY}"
    models:
      - "claude-sonnet-4"
      - "claude-haiku-3"

  - name: "local"
    type: "openai"
    api_key: "not-needed"
    base_url: "http://localhost:11434/v1"
    models:
      - "llama3"

routing:
  default_provider: "openai"
  default_model: "gpt-4o-mini"
  rules:
    - pattern: "claude-.*"
      provider: "anthropic"
    - pattern: "gpt-4o$"
      provider: "openai"
    - pattern: "gpt-4o-mini"
      provider: "openai"
    - pattern: "llama.*"
      provider: "local"

cost:
  max_budget_per_month: 1000.0
  alert_threshold: 80.0
