# Conduit Config: Privacy-First Mode
# Routes all requests containing sensitive data to local models.
# Requires Ollama running locally with Llama 3 or similar.

server:
  host: "0.0.0.0"
  port: 8080

providers:
  - name: "openai"
    type: "openai"
    api_key: "${OPENAI_API_KEY}"
    models:
      - "gpt-4o-mini"

  - name: "local"
    type: "openai"
    api_key: "not-needed"
    base_url: "http://localhost:11434/v1"
    models:
      - "llama3"
      - "mistral"

routing:
  default_provider: "local"
  default_model: "llama3"
  rules:
    - pattern: "gpt-.*"
      provider: "openai"
    - pattern: "llama.*|mistral.*"
      provider: "local"

cost:
  max_budget_per_month: 500.0
  alert_threshold: 75.0
